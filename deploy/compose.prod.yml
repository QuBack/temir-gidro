# Production overlay: docker compose -f compose.yml -f deploy/compose.prod.yml up -d --build
# Caddy terminates HTTPS (automatic Let's Encrypt), compresses responses,
# serves /media/ and redirects www → bare domain.
services:
  db:
    ports: !reset []
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped
    environment:
      DEBUG: "False"
      USE_X_FORWARDED_FOR: "True"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. temir-gidro.kz}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
