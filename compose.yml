# Local run of the full stack: docker compose up --build → http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: temir
      POSTGRES_USER: temir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temir -d temir"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://temir:${POSTGRES_PASSWORD:-temir}@db:5432/temir
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
