{% load i18n images %}
{# Full-screen viewer for photos wrapped in <a data-zoom>; driven by static/js/lightbox.js. #}
<dialog class="lightbox" data-lightbox aria-label="{% translate 'Просмотр фото' %}">
  <div class="lightbox__top">
    <span class="lightbox__count" data-lightbox-count aria-live="polite"></span>
    <button class="lightbox__btn lightbox__close" type="button" data-lightbox-close aria-label="{% translate 'Закрыть' %}">{% icon "x" %}</button>
  </div>
  <div class="lightbox__stage" data-lightbox-stage>
    <img class="lightbox__img" data-lightbox-img alt="" draggable="false">
    <span class="lightbox__spinner" data-lightbox-spinner hidden aria-hidden="true"></span>
  </div>
  <p class="lightbox__caption" data-lightbox-caption></p>
  <div class="lightbox__thumbs" data-lightbox-thumbs></div>
  <button class="lightbox__btn lightbox__arrow lightbox__prev" type="button" data-lightbox-prev aria-label="{% translate 'Предыдущее фото' %}">{% icon "chevron-left" %}</button>
  <button class="lightbox__btn lightbox__arrow lightbox__next" type="button" data-lightbox-next aria-label="{% translate 'Следующее фото' %}">{% icon "chevron-right" %}</button>
</dialog>
