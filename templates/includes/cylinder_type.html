{# A side view of one cylinder type, drawn in lines like the scheme of the lift: kind is tie-rod, welded or telescopic. #}
<svg class="cyl-type__svg" viewBox="0 0 340 140" aria-hidden="true" focusable="false">
  <line class="c-axis" x1="6" y1="70" x2="334" y2="70"/>
  {% if kind == "tie-rod" %}
  {# Square end caps pulled together by four tie rods with nuts on both ends. #}
  <rect class="c-port" x="40" y="22" width="12" height="8"/>
  <rect class="c-port" x="218" y="22" width="12" height="8"/>
  <rect class="c-body" x="64" y="42" width="146" height="56"/>
  <rect class="c-cap" x="30" y="30" width="34" height="80"/>
  <rect class="c-cap" x="210" y="30" width="34" height="80"/>
  <line class="c-thin" x1="22" y1="37" x2="252" y2="37"/>
  <line class="c-thin" x1="22" y1="103" x2="252" y2="103"/>
  <rect class="c-nut" x="18" y="32" width="12" height="10"/>
  <rect class="c-nut" x="18" y="98" width="12" height="10"/>
  <rect class="c-nut" x="244" y="32" width="12" height="10"/>
  <rect class="c-nut" x="244" y="98" width="12" height="10"/>
  <rect class="c-rod" x="244" y="58" width="66" height="24"/>
  <rect class="c-nut" x="310" y="60" width="16" height="20"/>
  {% elif kind == "welded" %}
  {# One welded barrel: a clevis eye on the bottom, a rod eye on the end. #}
  <rect class="c-port" x="74" y="32" width="12" height="8"/>
  <rect class="c-port" x="206" y="32" width="12" height="8"/>
  <rect class="c-cap" x="40" y="52" width="18" height="36"/>
  <circle class="c-eye" cx="28" cy="70" r="15"/>
  <circle class="c-hole" cx="28" cy="70" r="6"/>
  <rect class="c-body" x="58" y="40" width="172" height="60" rx="3"/>
  <rect class="c-cap" x="230" y="46" width="22" height="48"/>
  <rect class="c-rod" x="252" y="59" width="44" height="22"/>
  <rect class="c-cap" x="296" y="56" width="8" height="28"/>
  <circle class="c-eye" cx="316" cy="70" r="13"/>
  <circle class="c-hole" cx="316" cy="70" r="5"/>
  {% else %}
  {# Stages slide out of each other: long stroke, short when retracted. #}
  <rect class="c-cap" x="30" y="54" width="14" height="32"/>
  <circle class="c-eye" cx="20" cy="70" r="12"/>
  <circle class="c-hole" cx="20" cy="70" r="5"/>
  <rect class="c-body" x="44" y="34" width="112" height="72" rx="3"/>
  <rect class="c-rod" x="156" y="43" width="66" height="54"/>
  <rect class="c-rod" x="222" y="51" width="50" height="38"/>
  <rect class="c-rod" x="272" y="58" width="32" height="24"/>
  <rect class="c-cap" x="150" y="38" width="8" height="64"/>
  <rect class="c-cap" x="218" y="47" width="6" height="46"/>
  <rect class="c-cap" x="268" y="54" width="6" height="32"/>
  <circle class="c-eye" cx="316" cy="70" r="12"/>
  <circle class="c-hole" cx="316" cy="70" r="5"/>
  {% endif %}
</svg>
