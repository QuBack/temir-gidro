{% load images %}
{# Equipment at work: photo and its story side by side, alternating sides. #}
<div class="scenes">
  {% for sc in scenes %}
  <article class="scene{% if forloop.counter|divisibleby:2 %} scene--flip{% endif %}">
    <figure class="scene__photo{% if sc.render %} scene__photo--render{% endif %}">{% picture sc.image sc.alt sizes="(min-width: 60rem) 50vw, 100vw" %}</figure>
    <div class="scene__text">
      <span class="scene__num" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span>
      <h3>{{ sc.title }}</h3>
      <p>{{ sc.text }}</p>
      {% if sc.url %}<a class="more-link" href="{{ sc.url }}">{{ sc.link }}</a>{% endif %}
    </div>
  </article>
  {% endfor %}
</div>
