{% load images %}
{# Social profiles from COMPANY["social"]. #}
<ul class="social{% if variant %} social--{{ variant }}{% endif %}">
  {% for s in company.social %}
  <li><a href="{{ s.url }}" target="_blank" rel="noopener" aria-label="{{ s.name }}" title="{{ s.name }}">{% icon s.icon %}</a></li>
  {% endfor %}
</ul>
